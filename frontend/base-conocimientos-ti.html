<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>TI Learn</title>
<style>
  :root {
    --bg: #FFFFFF; --bg2: #F7F7F7; --border: #E5E5E5; --text: #3C3C3C; --text2: #777777;
    --green: #58CC02; --green-dark: #4CAD02; --blue: #1CB0F6; --blue-dark: #1899D6;
    --red: #FF4B4B; --red-dark: #E63E3E; --yellow: #FFC800; --yellow-dark: #E6B400;
    --purple: #CE82FF; --gray: #E5E5E5; --gray-dark: #AFAFAF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin:0; padding:0; height:100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; }
  .hidden { display:none !important; }

  /* ---------- PANTALLA RUTA (HOME) ---------- */
  #pathScreen { height: 100vh; height: -webkit-fill-available; display:flex; flex-direction:column; }
  #topHeader { display:flex; align-items:center; justify-content:space-between; padding: 14px 18px;
    border-bottom: 2px solid var(--border); flex-shrink:0; }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
  .brand span { color: var(--green); }
  .stats { display:flex; gap: 14px; }
  .stat { display:flex; align-items:center; gap:4px; font-weight: 800; font-size: 15px; }
  .stat.streak { color: #FF9600; }
  .stat.xp { color: #1CB0F6; }

  #pathScroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling: touch; padding: 18px 0 80px; }
  .unit-banner { margin: 18px auto 28px; max-width: 420px; padding: 16px 18px; border-radius: 16px; color: #fff;
    display:flex; align-items:center; justify-content:space-between; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .unit-banner .u-left { display:flex; align-items:center; gap:10px; }
  .unit-banner .u-icon { font-size: 22px; }
  .unit-banner .u-name { font-weight: 800; font-size: 15px; }
  .unit-banner .u-count { font-size: 11px; opacity: .9; font-weight: 600; }

  .path-track { max-width: 420px; margin: 0 auto; position: relative; padding: 4px 0 10px; }
  .node-row { display:flex; justify-content:center; margin: 6px 0; }
  .lesson-node { width: 62px; height: 62px; border-radius: 50%; border: none; display:flex; align-items:center;
    justify-content:center; font-size: 24px; position:relative; flex-shrink:0; }
  .lesson-node.locked-look { background: var(--gray); box-shadow: 0 5px 0 #cfcfcf; color: var(--gray-dark); font-weight:800; }
  .lesson-node.done { box-shadow: 0 5px 0 rgba(0,0,0,.18); color: #fff; }
  .lesson-node.current { box-shadow: 0 5px 0 rgba(0,0,0,.18); color: #fff; animation: pulse 1.8s infinite; }
  .lesson-node:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18) !important; }
  @keyframes pulse { 0%,100% { box-shadow: 0 5px 0 rgba(0,0,0,.18), 0 0 0 0 rgba(28,176,246,.4);} 50% { box-shadow: 0 5px 0 rgba(0,0,0,.18), 0 0 0 10px rgba(28,176,246,0);} }
  .node-label { text-align:center; font-size: 10.5px; color: var(--text2); font-weight: 700; max-width: 90px;
    margin: 4px auto 0; line-height:1.25; }
  .level-badge { display:inline-block; font-size: 9px; font-weight: 800; letter-spacing:.04em; padding: 2px 7px;
    border-radius: 999px; margin-top: 3px; }
  .level-badge.Básico { background:#DFF6D8; color:#3C7A00; }
  .level-badge.Intermedio { background:#FFF1C2; color:#8A6200; }
  .level-badge.Avanzado { background:#FFDCE0; color:#B32046; }
  .level-divider { max-width: 420px; margin: 22px auto 6px; display:flex; align-items:center; gap:10px;
    font-size: 11px; font-weight: 800; letter-spacing:.1em; color: var(--text2); }
  .level-divider::before, .level-divider::after { content:""; flex:1; height:2px; background: var(--border); }

  /* ---------- OVERLAY LECCIÓN ---------- */
  #lessonOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 50; display:flex; flex-direction:column;
    height: 100vh; height: -webkit-fill-available; }
  .lesson-top { display:flex; align-items:center; gap:12px; padding: 14px 16px; flex-shrink:0; }
  #closeLesson { background:none; border:none; font-size: 22px; color: var(--gray-dark); font-weight: 700; line-height:1; padding: 4px; }
  .lesson-progress-bar { flex:1; height: 12px; background: var(--gray); border-radius: 999px; overflow:hidden; }
  .lesson-progress-bar > div { height:100%; border-radius: 999px; transition: width .35s; }

  .lesson-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling: touch; padding: 10px 22px 20px; display:flex;
    flex-direction:column; }

  /* Tarjetas: concepto / significado / puntos clave */
  .teach-card { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; max-width: 480px;
    margin: 0 auto; width:100%; }
  .teach-eyebrow { font-size: 13px; font-weight: 800; letter-spacing:.08em; margin-bottom: 14px; }
  .teach-icon { font-size: 46px; margin-bottom: 6px; }
  .teach-title { font-size: 24px; font-weight: 800; line-height:1.25; margin-bottom: 14px; }
  .teach-text { font-size: 16.5px; line-height: 1.55; color: var(--text2); }
  .teach-points { text-align:left; list-style:none; padding:0; margin: 6px 0 0; display:flex; flex-direction:column; gap:12px; }
  .teach-points li { display:flex; gap:10px; font-size: 15px; line-height:1.5; color: var(--text); background: var(--bg2);
    border: 2px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .teach-points li .bullet-emoji { flex-shrink:0; }

  /* Preguntas */
  .quiz-card { max-width: 480px; margin: 0 auto; width:100%; }
  .quiz-title { font-size: 20px; font-weight: 800; line-height:1.35; margin: 4px 0 22px; }
  .quiz-opt { width:100%; text-align:left; padding: 16px 16px; margin-bottom: 12px; border-radius: 14px;
    border: 2px solid var(--border); border-bottom-width: 4px; background: #fff; color: var(--text);
    font-size: 15.5px; font-weight: 600; }
  .quiz-opt:active { transform: translateY(2px); }
  .quiz-opt.correct { border-color: var(--green); background: #D7FFB8; color: #3C7A00; }
  .quiz-opt.wrong { border-color: var(--red); background: #FFDFE0; color: #B32020; }
  .quiz-opt.disabled { pointer-events:none; }
  .quiz-opt.dim { opacity: .55; }

  /* Barra inferior fija */
  .bottom-bar { flex-shrink:0; padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); border-top: 2px solid var(--border); }
  .bottom-bar.feedback-correct { background: #D7FFB8; border-top: none; }
  .bottom-bar.feedback-wrong { background: #FFDFE0; border-top: none; }
  .feedback-row { display:flex; align-items:center; gap:10px; max-width:480px; margin: 0 auto 12px; font-weight: 800; font-size: 16px; }
  .feedback-row.ok { color: #3C7A00; }
  .feedback-row.bad { color: #B32020; }
  .feedback-sub { font-size: 13px; font-weight: 600; opacity: .85; margin-top: 2px; }

  .btn { display:block; width:100%; max-width:480px; margin:0 auto; padding: 15px; border-radius: 14px; border:none;
    font-weight: 800; font-size: 15px; text-align:center; letter-spacing:.02em; text-transform: uppercase; }
  .btn:active { transform: translateY(2px); }
  .btn-green { background: var(--green); color:#fff; box-shadow: 0 4px 0 var(--green-dark); }
  .btn-green:active { box-shadow: 0 2px 0 var(--green-dark); }
  .btn-outline { background:#fff; color: var(--gray-dark); border: 2px solid var(--border); border-bottom-width:4px; }

  /* Pantalla resumen final de lección */
  .summary-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 20px; }
  .summary-emoji { font-size: 64px; margin-bottom: 10px; }
  .summary-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; }
  .summary-stats { display:flex; gap: 14px; margin-bottom: 30px; }
  .summary-chip { background: var(--bg2); border-radius: 14px; padding: 14px 20px; min-width: 100px; }
  .summary-chip .n { font-size: 22px; font-weight: 800; }
  .summary-chip .l { font-size: 11px; color: var(--text2); font-weight: 700; text-transform: uppercase; margin-top: 2px; }
  .summary-chip.xp .n { color: #1CB0F6; }
  .summary-chip.acc .n { color: #58CC02; }

  @media (min-width: 640px) {
    .lesson-body { padding-left: 40px; padding-right: 40px; }
  }
</style>
</head>
<body>

<div id="pathScreen">
  <div id="topHeader">
    <div class="brand">TI <span>Learn</span></div>
    <div class="stats">
      <div class="stat streak">🔥 <span id="streakVal">0</span></div>
      <div class="stat xp">⚡ <span id="xpVal">0</span></div>
    </div>
  </div>
  <div id="pathScroll"></div>
</div>

<div id="lessonOverlay" class="hidden">
  <div class="lesson-top">
    <button id="closeLesson">✕</button>
    <div class="lesson-progress-bar"><div id="lessonProgressFill"></div></div>
  </div>
  <div class="lesson-body" id="lessonBody"></div>
  <div class="bottom-bar" id="bottomBar">
    <button class="btn btn-green" id="mainActionBtn">Continuar</button>
  </div>
</div>

<script>
const CATEGORIES = [{"id": "SI", "name": "Sistemas de Información", "icon": "LayoutGrid", "color": "#F0A73C", "topics": [{"id": "SI-01", "title": "Ciclo de vida de los sistemas de información", "overview": "Marco que ordena la construcción de un sistema desde la idea hasta el retiro, minimizando riesgo técnico y de negocio.", "points": ["Fases clásicas: planificación, análisis, diseño, desarrollo, implantación, mantenimiento y retiro.", "Modelos: cascada, incremental, en espiral, prototipado, y su contraste con marcos ágiles.", "Entregables clave por fase: EDT, especificación de requisitos (SRS), diseño arquitectónico, plan de pruebas.", "Gestión del cambio y control de versiones de requisitos como causa principal de sobrecostos."], "quiz": [{"q": "¿En qué fase del ciclo de vida se elabora la especificación de requisitos (SRS)?", "opts": ["Análisis", "Implantación", "Retiro", "Mantenimiento"], "correct": 0}, {"q": "¿Cuál es la principal causa de sobrecostos en proyectos de sistemas de información?", "opts": ["Falta de documentación", "Cambios no controlados de requisitos", "Exceso de pruebas", "Uso de metodologías ágiles"], "correct": 1}, {"q": "¿Qué modelo de ciclo de vida conviene más cuando los requisitos son inciertos y cambian con frecuencia?", "opts": ["Cascada", "Incremental o ágil", "Big Bang", "Waterfall puro"], "correct": 1}], "level": "Básico"}, {"id": "SI-02", "title": "Arquitectura empresarial", "overview": "Alinea la estrategia de negocio con la infraestructura tecnológica mediante capas y marcos formales.", "points": ["TOGAF (ADM): fases desde visión arquitectónica hasta gestión de cambios.", "Capas: negocio, aplicación, datos y tecnología; matrices de trazabilidad entre ellas.", "Zachman Framework como taxonomía de perspectivas (qué, cómo, dónde, quién, cuándo, por qué).", "Deuda técnica y arquitectónica: cómo medirla y priorizar su remediación."], "quiz": [{"q": "¿Qué marco de arquitectura empresarial define fases desde la visión hasta la gestión de cambios (ADM)?", "opts": ["Zachman", "TOGAF", "COBIT", "ITIL"], "correct": 1}, {"q": "¿Cuáles son las cuatro capas típicas de una arquitectura empresarial?", "opts": ["Negocio, aplicación, datos, tecnología", "Hardware, software, red, usuario", "Planificación, diseño, desarrollo, pruebas", "Estratégica, táctica, operativa, técnica"], "correct": 0}, {"q": "¿Qué taxonomía organiza las perspectivas de arquitectura según qué, cómo, dónde, quién, cuándo y por qué?", "opts": ["TOGAF", "Zachman Framework", "ITIL", "COBIT"], "correct": 1}], "level": "Avanzado"}, {"id": "SI-03", "title": "ERP, CRM y sistemas integrados", "overview": "Plataformas que centralizan procesos transversales de la organización sobre un modelo de datos común.", "points": ["ERP: módulos típicos (finanzas, compras, inventario, RRHH) y el concepto de 'single source of truth'.", "CRM: gestión del ciclo de vida del cliente, pipelines de venta y automatización de marketing.", "Integración vía middleware, ESB o iPaaS; patrones punto a punto vs orquestados.", "Riesgos de personalización excesiva ('customización') frente a configuración estándar."], "quiz": [{"q": "¿Qué sistema centraliza procesos como finanzas, compras e inventario en un modelo único de datos?", "opts": ["CRM", "ERP", "BI", "Data warehouse"], "correct": 1}, {"q": "¿Qué riesgo se asocia a la personalización excesiva de un ERP?", "opts": ["Mejor rendimiento", "Dificultad de actualización y mayor costo de mantenimiento", "Menor curva de aprendizaje", "Mayor seguridad"], "correct": 1}, {"q": "¿Qué tipo de plataforma automatiza principalmente marketing, ventas y atención al cliente?", "opts": ["ERP", "CRM", "BI", "Data Lake"], "correct": 1}], "level": "Básico"}, {"id": "SI-04", "title": "Business Intelligence y Data Warehousing", "overview": "Transformación de datos operacionales en información para la toma de decisiones.", "points": ["Arquitectura ETL/ELT, staging area, modelo estrella y copo de nieve.", "Diferencia entre Data Warehouse, Data Mart y Data Lake / Lakehouse.", "OLAP vs OLTP; operaciones de cubo: drill-down, roll-up, slice, dice.", "KPIs, cuadros de mando integral (Balanced Scorecard) y gobierno del dato."], "quiz": [{"q": "¿Qué esquema usa una tabla de hechos central rodeada de dimensiones desnormalizadas?", "opts": ["Copo de nieve", "Estrella", "Relacional normalizado", "Red"], "correct": 1}, {"q": "¿Qué operación OLAP permite pasar de un nivel agregado a uno más detallado?", "opts": ["Roll-up", "Drill-down", "Slice", "Dice"], "correct": 1}, {"q": "¿Qué término describe un repositorio de datos crudos y sin estructurar usado en analítica avanzada?", "opts": ["Data Mart", "Data Warehouse", "Data Lake", "OLTP"], "correct": 2}], "level": "Intermedio"}, {"id": "SI-05", "title": "Gestión de proyectos TI", "overview": "Metodologías para planificar, ejecutar y controlar proyectos tecnológicos con alcance, tiempo y costo variables.", "points": ["Cascada vs ágil: cuándo conviene cada una según incertidumbre y criticidad.", "Scrum: roles, eventos, artefactos, velocidad y burndown.", "Kanban: límites WIP, flujo continuo, lead time y cycle time.", "PMBOK: grupos de procesos e integración con marcos ágiles híbridos."], "quiz": [{"q": "En Scrum, ¿qué artefacto representa el trabajo pendiente priorizado del producto?", "opts": ["Sprint Backlog", "Product Backlog", "Burndown chart", "Definition of Done"], "correct": 1}, {"q": "¿Qué métrica de Kanban mide el tiempo desde que una tarea entra al flujo hasta que se completa?", "opts": ["Velocity", "Lead time", "Story points", "WIP"], "correct": 1}, {"q": "¿Qué metodología sigue fases secuenciales y dificulta iterar sobre el alcance ya cerrado?", "opts": ["Scrum", "Kanban", "Cascada", "XP"], "correct": 2}], "level": "Básico"}, {"id": "SI-06", "title": "Gobierno de TI", "overview": "Marcos que garantizan que la tecnología entregue valor de forma controlada y auditable.", "points": ["COBIT: objetivos de gobierno y gestión (EDM, APO, BAI, DSS, MEA).", "ITIL 4: cadena de valor del servicio y prácticas (gestión de incidentes, cambios, problemas).", "SLA, OLA y UC como contratos de nivel de servicio en cascada.", "Gestión de riesgos TI: matriz de probabilidad/impacto y planes de continuidad (BCP/DRP)."], "quiz": [{"q": "¿Qué marco se enfoca en la cadena de valor del servicio y prácticas como gestión de incidentes?", "opts": ["COBIT", "ITIL", "TOGAF", "PMBOK"], "correct": 1}, {"q": "¿Qué documento define compromisos formales de nivel de servicio entre proveedor y cliente?", "opts": ["OLA", "SLA", "RFC", "KPI"], "correct": 1}, {"q": "¿Qué marco de gobierno organiza sus objetivos en dominios como EDM, APO y BAI?", "opts": ["ITIL", "COBIT", "TOGAF", "Zachman"], "correct": 1}], "level": "Avanzado"}, {"id": "SI-07", "title": "Análisis y diseño de sistemas", "overview": "Técnicas de modelado que traducen requisitos de negocio en especificaciones técnicas.", "points": ["UML: diagramas de casos de uso, clases, secuencia y actividad.", "Modelado de procesos con BPMN y notación de eventos/gateways.", "Requisitos funcionales vs no funcionales; trazabilidad con matriz RTM.", "Diseño orientado a objetos: principios SOLID aplicados a nivel de sistema."], "quiz": [{"q": "¿Qué diagrama UML representa la interacción temporal entre objetos?", "opts": ["Diagrama de clases", "Diagrama de secuencia", "Diagrama de casos de uso", "Diagrama de actividad"], "correct": 1}, {"q": "¿Qué notación se usa para modelar procesos de negocio con eventos y gateways?", "opts": ["UML", "BPMN", "ERD", "DFD"], "correct": 1}, {"q": "¿Qué conjunto de principios de diseño orientado a objetos ayuda a construir sistemas mantenibles?", "opts": ["ACID", "SOLID", "CAP", "DIKW"], "correct": 1}], "level": "Intermedio"}, {"id": "SI-08", "title": "Gestión del conocimiento", "overview": "Captura, organiza y comparte el conocimiento organizacional para evitar la pérdida de know-how y acelerar la toma de decisiones.", "points": ["Pirámide DIKW: progresión de datos a información, conocimiento y sabiduría.", "Conocimiento tácito (difícil de documentar) vs explícito (codificado y transferible).", "Herramientas: wikis corporativas, bases de conocimiento, gestión documental.", "Comunidades de práctica y lecciones aprendidas como mecanismo de transferencia."], "quiz": [{"q": "¿Qué modelo describe la progresión de datos a sabiduría?", "opts": ["Pirámide DIKW", "Modelo OSI", "SDLC", "CMMI"], "correct": 0}, {"q": "¿Qué tipo de conocimiento es difícil de documentar y se transmite por experiencia?", "opts": ["Explícito", "Tácito", "Estructurado", "Codificado"], "correct": 1}, {"q": "¿Qué mecanismo facilita compartir lecciones aprendidas entre equipos con intereses comunes?", "opts": ["Comunidades de práctica", "Firewalls", "VLANs", "ETL"], "correct": 0}], "level": "Básico"}, {"id": "SI-09", "title": "Interoperabilidad y APIs", "overview": "Permite que sistemas heterogéneos intercambien datos y funcionalidad de forma estandarizada.", "points": ["REST vs SOAP: estilos arquitectónicos y formatos (JSON, XML).", "Autenticación de APIs: API keys, OAuth 2.0, JWT.", "Versionado de APIs y contratos formales (OpenAPI/Swagger).", "Patrones de integración: webhook, polling, mensajería asíncrona (colas)."], "quiz": [{"q": "¿Qué estándar describe formalmente los endpoints y contratos de una API REST?", "opts": ["OpenAPI / Swagger", "WSDL", "XML Schema", "UML"], "correct": 0}, {"q": "¿Qué mecanismo de autenticación de API usa tokens firmados y auto-contenidos?", "opts": ["API Key simple", "JWT", "Basic Auth", "Cookies"], "correct": 1}, {"q": "¿Qué patrón permite notificar eventos a otro sistema sin que este consulte constantemente?", "opts": ["Polling", "Webhook", "Batch processing", "FTP"], "correct": 1}], "level": "Intermedio"}, {"id": "SI-10", "title": "Cloud Computing: modelos y ventajas", "overview": "La computación en la nube permite consumir recursos de TI bajo demanda, reduciendo la necesidad de infraestructura propia.", "points": ["Ventaja clave: reduce costos al disminuir la necesidad de adquirir hardware avanzado propio.", "Modelos de servicio: IaaS (infraestructura), PaaS (plataforma) y SaaS (software como servicio).", "SaaS entrega aplicaciones completas listas para usar por Internet, sin que el cliente gestione infraestructura.", "Modelos de despliegue: nube pública, privada, híbrida y comunitaria, según el nivel de control y aislamiento requerido."], "quiz": [{"q": "¿Cuál es una ventaja de la computación en la nube (Cloud Computing)?", "opts": ["Reduce costos al disminuir la necesidad de hardware propio", "Los datos del negocio no residen en la empresa", "Interdependencia de operadores de internet", "La escalabilidad es solo a largo plazo"], "correct": 0}, {"q": "¿Qué significa SaaS en el contexto de Cloud Computing?", "opts": ["Server as a Service", "Software as a Service", "System as a Service", "Solution as a Service"], "correct": 1}, {"q": "¿Qué modelo de servicio en la nube entrega solo la infraestructura (servidores, almacenamiento, red) y deja al cliente gestionar el sistema operativo y las aplicaciones?", "opts": ["SaaS", "PaaS", "IaaS", "DaaS"], "correct": 2}], "level": "Básico"}]}, {"id": "RED", "name": "Redes", "icon": "Network", "color": "#4FD1C5", "topics": [{"id": "RED-01", "title": "Modelo OSI vs TCP/IP", "overview": "Marcos de referencia para entender la comunicación en capas entre sistemas.", "points": ["7 capas OSI vs 4 capas TCP/IP; encapsulado y desencapsulado de PDUs.", "Unidades de datos por capa: bits, tramas, paquetes, segmentos, datos.", "Protocolos representativos por capa (Ethernet, IP, TCP/UDP, HTTP/DNS).", "Uso práctico del modelo para diagnóstico sistemático de fallos ('capa por capa')."], "quiz": [{"q": "¿Cuántas capas tiene el modelo OSI?", "opts": ["4", "5", "7", "8"], "correct": 2}, {"q": "¿Qué unidad de datos corresponde a la capa de transporte?", "opts": ["Trama", "Paquete", "Segmento", "Bit"], "correct": 2}, {"q": "¿Qué capa del modelo OSI se encarga del direccionamiento lógico y ts": ["RIP", "OSPF", "EIGRP", "BGP"], "correct": 1}, {"q": "¿Qué protocolo se usa principalmente para enrutamiento entre sistemas autónomos en Internet?", "opts": ["OSPF", "BGP", "RIP", "STP"], "correct": 1}, {"q": "¿Qué técnica reduce el tamaño de las tablas de enrutamiento agrupando rutas contiguas?", "opts": ["NAT", "Route summarization", "VLSM", "Spanning tree"], "correct": 1}, {"q": "¿Qué dispositivos son los más importantes para regular el tráfico en redes grandes, determinando el mejor camino entre direcciones de red?", "opts": ["Puentes", "Hubs", "Routers", "Bridges"], "correct": 2}], "level": "Intermedio"}, {"id": "RED-04", "title": "Switching y VLANs", "overview": "Conmutación en capa 2 y segmentación lógica de dominios de difusión.", "points": ["Tablas MAC, dominios de colisión vs de broadcast.", "VLANs: trunking 802.1Q, VLAN nativa, y enrutamiento inter-VLAN (router-on-a-stick, SVI).", "Spanning Tree Protocol (STP/RSTP): prevención de bucles y elección de puente raíz.", "EtherChannel / LACP para agregación de enlaces y redundancia."], "quiz": [{"q": "¿Qué protocolo previene bucles en una red conmutada?", "opts": ["VLAN trunking", "Spanning Tree Protocol", "LACP", "DHCP"], "correct": 1}, {"q": "¿Qué estándar define el etiquetado de VLANs en enlaces troncales?", "opts": ["802.1X", "802.1Q", "802.11", "802.3"], "correct": 1}, {"q": "¿Qué tecnología agrupa varios enlaces físicos en uno lógico para mayor ancho de banda y redundancia?", "opts": ["VLAN trunking", "EtherChannel / LACP", "STP", "QoS"], "correct": 1}], "level": "Intermedio"}, {"id": "RED-05", "title": "Calidad de servicio (QoS)", "overview": "Mecanismos para priorizar tráfico sensible a latencia frente a tráfico best-effort.", "points": ["Clasificación y marcado: DSCP, CoS a nivel de capa 2 y 3.", "Modelos: IntServ (reserva de recursos) vs DiffServ (clases agregadas).", "Mecanismos de cola: FIFO, WFQ, priority queuing y policing/shaping.", "Aplicación típica en voz sobre IP (VoIP) y videoconferencia."], "quiz": [{"q": "¿Qué modelo de QoS clasifica el tráfico en clases agregadas sin reservar recursos por flujo?", "opts": ["IntServ", "DiffServ", "MPLS", "VLAN"], "correct": 1}, {"q": "¿Qué campo se usa comúnmente para marcar prioridad de tráfico en capa 3?", "opts": ["DSCP", "VLAN ID", "TTL", "MTU"], "correct": 0}, {"q": "¿Qué mecanismo de cola reparte de forma justa el ancho de banda entre distintos flujos?", "opts": ["FIFO", "WFQ (Weighted Fair Queuing)", "Priority queuing estricta", "Round robin simple"], "correct": 1}], "level": "Avanzado"}, {"id": "RED-06", "title": "Redes inalámbricas", "overview": "Comunicación sin cables basada en estándares de radiofrecuencia.", "points": ["Familia 802.11 (a/b/g/n/ac/ax): bandas, anchos de canal y velocidades.", "Seguridad WiFi: evolución WEP → WPA2 → WPA3 y autenticación 802.1X/EAP.", "Diseño de cobertura: solapamiento de canales, roaming y site survey.", "Controladoras WLAN vs puntos de acceso autónomos."], "quiz": [{"q": "¿Qué protocolo de seguridad WiFi es el más reciente y seguro?", "opts": ["WEP", "WPA", "WPA2", "WPA3"], "correct": 3}, {"q": "¿Qué actividad evalúa la cobertura inalámbrica antes de desplegar puntos de acceso?", "opts": ["Site survey", "Port scanning", "Subnetting", "Peering"], "correct": 0}, {"q": "¿Qué estándar 802.11 corresponde a Wi-Fi 6?", "opts": ["802.11n", "802.11ac", "802.11ax", "802.11g"], "correct": 2}], "level": "Básico"}, {"id": "RED-07", "title": "WAN, VPN y SD-WAN", "overview": "Conectividad entre sedes distantes y su evolución hacia redes definidas por software.", "points": ["Tecnologías WAN tradicionales: MPLS, líneas dedicadas, Frame Relay (legado).", "VPN de sitio a sitio (IPsec) y de acceso remoto (SSL/TLS VPN).", "SD-WAN: separación del plano de control y datos, selección dinámica de enlace.", "Cifrado, túneles GRE/IPsec y consideraciones de rendimiento (overhead)."], "quiz": [{"q": "¿Qué tipo de VPN conecta permanentemente dos sedes de una organización?", "opts": ["VPN de acceso remoto", "VPN de sitio a sitio", "SSL VPN de usuario", "MPLS puro"], "correct": 1}, {"q": "¿Qué distingue a SD-WAN de una WAN tradicional?", "opts": ["Uso exclusivo de fibra óptica", "Separación de plano de control y datos con selección dinámica de enlace", "Ausencia de cifrado", "Uso obligatorio de MPLS"], "correct": 1}, {"q": "¿Qué protocolo de túnel se combina frecuentemente con IPsec para transportar tráfico multiprotocolo?", "opts": ["GRE", "HTTP", "FTP", "SNMP"], "correct": 0}], "level": "Intermedio"}, {"id": "RED-08", "title": "Troubleshooting de redes", "overview": "Metodología estructurada para diagnosticar y resolver incidencias de conectividad.", "points": ["Enfoque top-down, bottom-up y divide-and-conquer según el modelo OSI.", "Herramientas: ping, traceroute/tracert, nslookup/dig, captura de paquetes (Wireshark).", "Análisis de latencia, pérdida de paquetes y jitter.", "Documentación de baseline para detectar desviaciones de comportamiento normal."], "quiz": [{"q": "¿Qué herramienta muestra la ruta que siguen los paquetes hacia un destino?", "opts": ["ping", "traceroute", "nslookup", "netstat"], "correct": 1}, {"q": "¿Qué enfoque de diagnóstico comienza revisando la capa física y sube progresivamente?", "opts": ["Top-down", "Bottom-up", "Divide and conquer", "Aleatorio"], "correct": 1}, {"q": "¿Qué herramienta permite capturar y analizar tráfico de red a nivel de paquete?", "opts": ["Wireshark", "nslookup", "ping", "traceroute"], "correct": 0}], "level": "Intermedio"}, {"id": "RED-09", "title": "Protocolos de capa de aplicación", "overview": "Servicios que permiten la resolución de nombres, asignación de direcciones y transferencia de contenido en la red.", "points": ["DNS: jerarquía, tipos de registro (A, AAAA, MX, CNAME) y resolución recursiva vs iterativa.", "DHCP: proceso DORA (Discover, Offer, Request, Acknowledge).", "HTTP/HTTPS: métodos, códigos de estado, y evolución hacia HTTP/2 y HTTP/3 (QUIC).", "FTP/SFTP y su uso en transferencia segura de archivos."], "quiz": [{"q": "¿Qué tipo de registro DNS traduce un nombre a una dirección IPv4?", "opts": ["A", "MX", "CNAME", "TXT"], "correct": 0}, {"q": "¿Cuál es el proceso de 4 pasos que sigue un cliente para obtener IP vía DHCP?", "opts": ["SYN-ACK-FIN-RST", "DORA (Discover-Offer-Request-Ack)", "GET-POST-PUT-DELETE", "ARP request-reply"], "correct": 1}, {"q": "¿Qué protocolo de transporte subyace en HTTP/3 (QUIC)?", "opts": ["TCP", "UDP", "SCTP", "ICMP"], "correct": 1}], "level": "Básico"}, {"id": "RED-10", "title": "SDN y virtualización de red", "overview": "Separación del plano de control y de datos para gestionar la red de forma centralizada y programable.", "points": ["Arquitectura SDN: controlador centralizado, plano de datos, protocolo OpenFlow.", "NFV: virtualización de funciones de red (firewalls, balanceadores) sobre hardware genérico.", "Beneficios: automatización, programabilidad y reducción de costos de hardware dedicado.", "Casos de uso frecuentes en centros de datos y proveedores de nube."], "quiz": [{"q": "¿Qué protocolo se asocia comúnmente con la comunicación entre el controlador SDN y los switches?", "opts": ["BGP", "OpenFlow", "OSPF", "SNMP"], "correct": 1}, {"q": "¿Qué tecnología permite ejecutar funciones de red como software sobre hardware genérico?", "opts": ["NFV", "VLAN", "STP", "QoS"], "correct": 0}, {"q": "¿Cuál es un beneficio clave de SDN frente a redes tradicionales?", "opts": ["Mayor latencia", "Gestión centralizada y programable", "Menor escalabilidad", "Configuración exclusivamente manual"], "correct": 1}], "level": "Avanzado"}, {"id": "RED-11", "title": "Dispositivos de red: repetidores, hubs, switches, bridges y routers", "overview": "Cada dispositivo de red opera en una capa distinta del modelo OSI y cumple una función específica en la transmisión y segmentación del tráfico.", "points": ["Repetidor: regenera la señal eléctrica u óptica para extender la distancia de un enlace, sin filtrar tráfico (capa física).", "Hub: repetidor multipuerto que retransmite el tráfico a todos sus puertos, generando un único dominio de colisión.", "Switch: opera en capa de enlace, aprende direcciones MAC y envía tramas solo al puerto destino, eliminando colisiones.", "Bridge: predecesor del switch; divide una red en segmentos de colisión leyendo direcciones MAC (capa de enlace).", "Router: opera en capa de red, enruta paquetes entre redes distintas basándose en direcciones IP."], "quiz": [{"q": "¿Qué dispositivo de capa física regenera la señal original antes de que se degrade por atenuación?", "opts": ["Repetidor", "Hub", "Switch", "Router"], "correct": 0}, {"q": "En una LAN con muchas colisiones de paquetes por usar un hub central, ¿qué cambio resuelve el problema de forma más eficiente?", "opts": ["Sustituir el cableado UTP por fibra óptica", "Sustituir el hub por un switch", "Añadir más hubs en cascada", "Aumentar la potencia de la señal"], "correct": 1}, {"q": "¿En qué capa del modelo OSI opera un bridge?", "opts": ["Física", "Red", "Enlace de datos", "Transporte"], "correct": 2}], "level": "Básico"}, {"id": "RED-12", "title": "Cableado estructurado y estándares de cableado", "overview": "Los sistemas de cableado estructurado y sus estándares garantizan una infraestructura física ordenada, escalable y compatible entre fabricantes.", "points": ["Cableado estructurado: esquema genérico que cubre las necesidades de conectividad de un edificio a largo plazo, integrando voz, datos y video.", "Cableado horizontal (piso a puesto de trabajo) vs cableado vertical o backbone (entre plantas o edificios).", "Estándar TIA/EIA-568-B: define el orden de los pares del cable UTP en el conector RJ-45.", "DTE (equipo terminal de datos, como el PC) y DCE (equipo que adapta la señal, como el módem) son la terminología estándar de los extremos de un enlace."], "quiz": [{"q": "Según el estándar TIA/EIA-568-B, ¿cómo se organizan los pares del cable UTP?", "opts": ["Blanco Verde/Verde, Blanco Naranja/Azul, Blanco Azul/Naranja, Blanco Café/Café", "Blanco Naranja/Azul, Blanco Azul/Naranja, Blanco Verde/Verde, Blanco Café/Café", "Blanco Naranja/Naranja, Blanco Verde/Azul, Blanco Azul/Verde, Blanco Café/Café", "Blanco Azul/Naranja, Blanco Naranja/Azul, Blanco Verde/Verde, Blanco Café/Café"], "correct": 1}, {"q": "En los estándares internacionales de redes, ¿cómo se denomina oficialmente a la terminal o computadora?", "opts": ["DTE (equipo terminal de datos)", "Módem (modulador/demodulador)", "DCE (equipo de comunicación de datos)", "Router o encaminador"], "correct": 0}, {"q": "¿Qué término describe el esquema genérico de cableado que cubre las necesidades de conectividad de un edificio a largo plazo, integrando datos, voz y video?", "opts": ["Backbone", "Cableado vertical", "Cableado horizontal", "Cableado estructurado"], "correct": 3}], "level": "Básico"}, {"id": "RED-13", "title": "Modelos de conectividad y tendencias de red", "overview": "Distintos modelos de red y tendencias modernas de acceso determinan cómo los usuarios y dispositivos se conectan a los recursos.", "points": ["Modelo cliente/servidor: el software del servidor se ejecuta en equipos dedicados que atienden solicitudes de los clientes.", "Redes SOHO (Small Office/Home Office): diseñadas para pequeñas oficinas o teletrabajo doméstico.", "BYOD (Bring Your Own Device): tendencia que permite a los usuarios acceder a recursos corporativos desde sus propios dispositivos.", "Intranet (red privada interna) vs extranet (acceso controlado a colaboradores o terceros externos)."], "quiz": [{"q": "¿Qué término describe un modelo en el que el software del servidor se ejecuta en computadoras dedicadas?", "opts": ["Internet", "Extranet", "Intranet", "Cliente/Servidor"], "correct": 3}, {"q": "¿Qué término describe una red utilizada por personas que trabajan desde casa o una pequeña oficina remota?", "opts": ["Red SOHO", "Calidad de servicio", "Red convergente", "BYOD"], "correct": 0}, {"q": "Una corporación permite a los usuarios acceder a recursos de red desde sus propias laptops y smartphones. ¿Qué tendencia describe esto?", "opts": ["Computación en la nube", "Videoconferencia", "Colaboración en línea", "BYOD"], "correct": 3}], "level": "Básico"}, {"id": "RED-14", "title": "Multicast, puertos conocidos y gestión de switches", "overview": "Conceptos operativos que definen cómo se distribuye el tráfico en la red y cómo se administran remotamente los dispositivos de conmutación.", "points": ["Multicast: el tráfico se envía a un grupo selecto de hosts suscritos, a diferencia de broadcast (todos) o unicast (uno solo).", "Puertos bien conocidos: HTTP (80), HTTPS (443), SSH (22), FTP (21), SMTP (25), entre otros, identifican servicios estándar.", "La administración remota de un switch de capa 2 se realiza a través de una interfaz virtual (SVI) configurada con una IP de gestión.", "Diferencia entre unicast, broadcast y multicast según el número de destinatarios del mensaje."], "quiz": [{"q": "¿Cuál es una característica de los mensajes multicast?", "opts": ["Deben ser reconocidos por todos los hosts", "Se envían a todos los hosts de la red", "Se envían a un solo destino", "Se envían a un grupo selecto de hosts"], "correct": 3}, {"q": "¿Qué interfaz permite la administración remota de un switch de capa 2?", "opts": ["La interfaz AUX", "La interfaz virtual del switch (SVI)", "La interfaz del puerto de consola", "La primera interfaz de puerto Ethernet"], "correct": 1}, {"q": "¿Cuál es el puerto predeterminado para HTTP y HTTPS, respectivamente?", "opts": ["80 y 443", "22 y 80", "21 y 22", "25 y 443"], "correct": 0}], "level": "Intermedio"}, {"id": "RED-15", "title": "Direccionamiento IPv4 y direcciones MAC", "overview": "Las direcciones IP y MAC identifican de forma lógica y física a los dispositivos dentro de una red.", "points": ["Una dirección IPv4 se compone de 4 bytes (32 bits), representados en notación decimal punteada.", "Cada octeto de una IPv4 debe estar en el rango 0-255; valores fuera de ese rango son direcciones inválidas.", "La dirección MAC identifica físicamente la interfaz de red de un dispositivo y es la que se usa para bloquearlo a nivel de switch/router.", "Diferencia entre dirección lógica (IP, puede cambiar) y dirección física (MAC, grabada en el hardware del fabricante)."], "quiz": [{"q": "¿De cuántos bytes se compone una dirección IPv4?", "opts": ["4", "32", "12", "24"], "correct": 0}, {"q": "¿Cuál de las siguientes direcciones IP no es válida?", "opts": ["010.010.010.010", "200.123.251.001", "212.258.037.005", "001.001.001.001"], "correct": 2}, {"q": "Detectas un dispositivo sospechoso en tu red y quieres bloquearlo desde el router. ¿Qué dato debes anotar?", "opts": ["Su dirección IP", "Su nombre", "Su dirección MAC", "Su ubicación"], "correct": 2}], "level": "Básico"}, {"id": "RED-16", "level": "Básico", "title": "Arquitecturas de aplicaciones de red y sockets", "overview": "Antes de estudiar protocolos específicos, es clave entender cómo se estructuran las aplicaciones de red y cómo se comunican los procesos entre sí.", "points": ["Arquitectura cliente-servidor: un servidor siempre activo atiende solicitudes de múltiples clientes.", "Arquitectura P2P: los pares se comunican directamente entre sí sin depender de un servidor siempre activo, ofreciendo alta escalabilidad.", "Un socket es la interfaz entre el proceso de aplicación y el protocolo de transporte subyacente.", "Los servicios de transporte que requiere una aplicación se definen por throughput, retardo, seguridad y fiabilidad de los datos."], "quiz": [{"q": "¿Qué arquitectura depende de un servidor siempre activo que atiende solicitudes de múltiples clientes?", "opts": ["P2P", "Cliente-servidor", "Híbrida", "Broadcast"], "correct": 1}, {"q": "¿Qué elemento actúa como interfaz entre el proceso de aplicación y el protocolo de transporte?", "opts": ["El socket", "El router", "El firewall", "El DNS"], "correct": 0}, {"q": "¿Qué ventaja principal ofrece una arquitectura P2P frente a la cliente-servidor?", "opts": ["Mayor control centralizado", "Alta escalabilidad al aprovechar los recursos de los propios pares", "Menor complejidad de programación", "Mayor seguridad por defecto"], "correct": 1}]}, {"id": "RED-17", "level": "Básico", "title": "HTTP y almacenamiento en caché web", "overview": "HTTP es el protocolo de la capa de aplicación que sustenta la Web, definiendo cómo los clientes solicitan y los servidores entregan recursos.", "points": ["HTTP usa TCP como protocolo de transporte subyacente para garantizar entrega fiable.", "Conexiones persistentes (reutilizan la misma conexión TCP) vs no persistentes (una conexión por objeto).", "Las cookies permiten mantener estado entre peticiones, ya que HTTP es un protocolo sin estado por diseño.", "Un servidor de caché web (proxy) almacena copias de objetos para reducir el tiempo de respuesta y el tráfico en el enlace de acceso."], "quiz": [{"q": "¿Qué protocolo de transporte usa HTTP para garantizar la entrega fiable de los mensajes?", "opts": ["UDP", "TCP", "ICMP", "ARP"], "correct": 1}, {"q": "¿Por qué HTTP necesita cookies para mantener información entre peticiones?", "opts": ["Porque es un protocolo orientado a conexión", "Porque es un protocolo sin estado", "Porque usa UDP", "Porque cifra los datos"], "correct": 1}, {"q": "¿Qué función cumple un servidor de caché web (proxy) en la Web?", "opts": ["Enruta paquetes entre redes distintas", "Traduce nombres de dominio a IP", "Almacena copias de objetos para reducir tiempo de respuesta y tráfico", "Cifra las conexiones HTTPS"], "correct": 2}]}, {"id": "RED-18", "level": "Básico", "title": "Correo electrónico en Internet", "overview": "El correo electrónico combina distintos protocolos: uno para el envío entre servidores y otros para el acceso del usuario final a su buzón.", "points": ["SMTP se usa para transferir el correo desde el servidor del remitente hacia el servidor del destinatario.", "SMTP requiere tradicionalmente que los mensajes estén en formato de texto ASCII de 7 bits.", "Para acceder al correo desde el servidor final, el usuario usa protocolos de acceso como POP3 o IMAP.", "IMAP permite gestionar el correo en carpetas directamente en el servidor, a diferencia de POP3 que suele descargarlo."], "quiz": [{"q": "¿Qué protocolo se usa para transferir el correo desde el servidor del remitente al del destinatario?", "opts": ["POP3", "IMAP", "SMTP", "HTTP"], "correct": 2}, {"q": "¿Qué protocolo de acceso a correo permite gestionar los mensajes en carpetas directamente en el servidor?", "opts": ["SMTP", "IMAP", "FTP", "ARP"], "correct": 1}, {"q": "¿En qué formato deben estar tradicionalmente los mensajes para ser transmitidos por SMTP?", "opts": ["Binario comprimido", "Texto ASCII de 7 bits", "XML", "JSON"], "correct": 1}]}, {"id": "RED-19", "level": "Intermedio", "title": "Multiplexación y transporte UDP", "overview": "La capa de transporte permite que múltiples procesos de una misma máquina compartan la red mediante multiplexación y demultiplexación de segmentos.", "points": ["Multiplexación: combinar datos de varios sockets en segmentos en el emisor; demultiplexación: entregar cada segmento al socket correcto en el receptor.", "Los sockets se identifican mediante una combinación de puertos y, en TCP, también direcciones IP.", "UDP es un protocolo sin conexión, sin control de flujo ni de congestión, ideal para aplicaciones sensibles al retardo.", "UDP incluye una suma de comprobación opcional para detectar (no corregir) errores en el segmento."], "quiz": [{"q": "¿Qué proceso combina datos de varios sockets en segmentos de transporte en el emisor?", "opts": ["Demultiplexación", "Multiplexación", "Fragmentación", "Enrutamiento"], "correct": 1}, {"q": "¿Por qué UDP es preferido para aplicaciones sensibles al retardo como VoIP?", "opts": ["Porque garantiza entrega fiable", "Porque no tiene el overhead de establecimiento de conexión ni control de congestión", "Porque cifra los datos", "Porque usa múltiples rutas"], "correct": 1}, {"q": "¿Qué mecanismo de UDP permite detectar errores en el segmento recibido?", "opts": ["Suma de comprobación (checksum)", "Control de flujo", "Ventana deslizante", "Confirmación (ACK)"], "correct": 0}]}, {"id": "RED-20", "level": "Avanzado", "title": "Transferencia de datos fiable: ARQ, Go-Back-N y Repetición Selectiva", "overview": "Los protocolos de transferencia de datos fiable garantizan que la información llegue completa y en orden incluso sobre un canal que puede perder o corromper datos.", "points": ["Los protocolos ARQ (Automatic Repeat reQuest) usan confirmaciones (ACK) y temporizadores para detectar y retransmitir pérdidas.", "Stop-and-wait envía un paquete a la vez, lo que resulta ineficiente sobre enlaces de alta latencia.", "Go-Back-N (GBN) permite enviar varios paquetes sin esperar confirmación (pipelining), pero retransmite todos los pendientes ante un error.", "Repetición Selectiva (SR) retransmite únicamente el paquete perdido o corrupto, siendo más eficiente que GBN a costa de mayor complejidad en el receptor."], "quiz": [{"q": "¿Qué técnica usan los protocolos ARQ para detectar y recuperar paquetes perdidos?", "opts": ["Confirmaciones (ACK) y temporizadores", "Cifrado simétrico", "Multicast", "Fragmentación IP"], "correct": 0}, {"q": "¿Cuál es la principal limitación del protocolo stop-and-wait?", "opts": ["No detecta errores", "Es ineficiente en enlaces de alta latencia al enviar un paquete a la vez", "No puede usarse sobre TCP", "Requiere direcciones IP fijas"], "correct": 1}, {"q": "¿Qué diferencia principal existe entre Go-Back-N y Repetición Selectiva?", "opts": ["GBN retransmite todos los paquetes pendientes ante un error; SR solo el paquete perdido", "GBN es más lento que stop-and-wait", "SR no usa confirmaciones (ACK)", "GBN se usa solo en UDP"], "correct": 0}]}, {"id": "RED-21", "level": "Intermedio", "title": "TCP: conexión, control de flujo y gestión", "overview": "TCP ofrece un servicio orientado a la conexión, fiable y con control de flujo entre extremos.", "points": ["El establecimiento de conexión usa el saludo de tres vías (three-way handshake: SYN, SYN-ACK, ACK).", "El control de flujo evita que el emisor sature el buffer de recepción del receptor mediante una ventana de recepción anunciada.", "La gestión de la conexión incluye también su cierre ordenado mediante segmentos FIN.", "TCP estima dinámicamente el tiempo de ida y vuelta (RTT) para ajustar el temporizador de retransmisión."], "quiz": [{"q": "¿Qué secuencia de segmentos se usa para establecer una conexión TCP?", "opts": ["FIN-ACK-FIN", "SYN, SYN/ACK, ACK", "GET-POST-ACK", "ARP request-reply"], "correct": 1}, {"q": "¿Qué mecanismo de TCP evita que el emisor sature el buffer de recepción del receptor?", "opts": ["Control de congestión", "Control de flujo mediante ventana de recepción", "Multiplexación", "Fragmentación"], "correct": 1}, {"q": "¿Qué tipo de segmento se usa para cerrar ordenadamente una conexión TCP?", "opts": ["SYN", "FIN", "ICMP", "ARP"], "correct": 1}]}, {"id": "RED-22", "level": "Avanzado", "title": "Control de congestión en TCP", "overview": "TCP ajusta dinámicamente su tasa de envío para evitar saturar la red, reaccionando a señales implícitas o explícitas de congestión.", "points": ["La congestión ocurre cuando demasiados emisores intentan enviar datos más rápido de lo que la red puede transportar.", "TCP usa el algoritmo AIMD (incremento aditivo, decremento multiplicativo) para ajustar su ventana de congestión.", "La pérdida de un paquete se interpreta tradicionalmente como señal de congestión, provocando una reducción drástica de la ventana.", "ECN (Notificación Explícita de Congestión) permite que la red marque paquetes para señalar congestión antes de que ocurra la pérdida."], "quiz": [{"q": "¿Qué algoritmo usa TCP para ajustar gradualmente su ventana de congestión?", "opts": ["AIMD (incremento aditivo, decremento multiplicativo)", "Round robin", "VLSM", "CSMA/CD"], "correct": 0}, {"q": "¿Qué evento interpreta tradicionalmente TCP como señal de congestión en la red?", "opts": ["Un ACK duplicado o la pérdida de un paquete", "Un cambio de dirección IP", "Una VLAN nueva", "Un ping fallido"], "correct": 0}, {"q": "¿Qué mecanismo permite que los routers marquen paquetes para señalar congestión antes de que se pierdan datos?", "opts": ["ECN (Notificación Explícita de Congestión)", "NAT", "ARP", "DHCP"], "correct": 0}]}, {"id": "RED-23", "level": "Avanzado", "title": "El interior de un router: reenvío, colas y NAT", "overview": "Un router combina procesamiento de puertos de entrada, un tejido de conmutación interno y procesamiento de puertos de salida para reenviar paquetes.", "points": ["El procesamiento del puerto de entrada determina el puerto de salida mediante la tabla de reenvío antes de conmutar el paquete internamente.", "Pueden formarse colas tanto en los puertos de entrada como en los de salida cuando la tasa de llegada supera la capacidad de conmutación o del enlace.", "La planificación de paquetes (packet scheduling) decide el orden de transmisión cuando varios paquetes compiten por el mismo enlace de salida.", "NAT traduce direcciones privadas a una dirección pública compartida, permitiendo que múltiples hosts internos naveguen con una sola IP externa."], "quiz": [{"q": "¿Qué componente de un router determina el puerto de salida de un paquete antes de conmutarlo internamente?", "opts": ["El procesamiento del puerto de entrada", "El plano de control SDN", "El protocolo ARP", "El firewall"], "correct": 0}, {"q": "¿Dónde pueden formarse colas dentro de un router cuando la tasa de llegada supera la capacidad disponible?", "opts": ["Solo en el puerto de entrada", "Solo en el puerto de salida", "Tanto en los puertos de entrada como de salida", "Nunca se forman colas en un router"], "correct": 2}, {"q": "¿Qué tecnología permite que múltiples hosts con direcciones privadas compartan una sola dirección IP pública?", "opts": ["NAT", "VLAN", "ARP", "ICMP"], "correct": 0}]}, {"id": "RED-24", "level": "Avanzado", "title": "Algoritmos de enrutamiento: estado de enlace y vector de distancias", "overview": "Los algoritmos de enrutamiento calculan el camino de menor costo entre routers para construir las tablas de reenvío.", "points": ["Los algoritmos de estado de enlace (LS) requieren conocimiento global de la topología y calculan rutas mediante el algoritmo de Dijkstra.", "Los algoritmos de vector de distancias (DV) son descentralizados: cada router solo intercambia información con sus vecinos directos (basado en Bellman-Ford).", "OSPF es un protocolo de estado de enlace usado dentro de un sistema autónomo; BGP es el estándar de facto para el enrutamiento entre sistemas autónomos.", "El problema de 'cuenta a infinito' es una limitación clásica de los algoritmos de vector de distancias ante fallos de enlace."], "quiz": [{"q": "¿Qué algoritmo usan típicamente los protocolos de estado de enlace (LS) para calcular la ruta más corta?", "opts": ["Bellman-Ford", "Dijkstra", "AIMD", "RSA"], "correct": 1}, {"q": "¿Qué característica distingue a los algoritmos de vector de distancias (DV) de los de estado de enlace (LS)?", "opts": ["Requieren visión global de toda la topología", "Cada router solo intercambia información con sus vecinos directos", "No pueden usarse en Internet", "Solo funcionan con IPv6"], "correct": 1}, {"q": "¿Qué problema clásico puede afectar a los algoritmos de vector de distancias ante la caída de un enlace?", "opts": ["Cuenta a infinito", "Colisión de direcciones MAC", "Fragmentación excesiva", "Saturación de la caché DNS"], "correct": 0}]}, {"id": "RED-25", "level": "Intermedio", "title": "Detección y corrección de errores en la capa de enlace", "overview": "Antes de entregar una trama a capas superiores, la capa de enlace verifica su integridad mediante técnicas de detección de errores.", "points": ["Los bits de paridad permiten detectar un número impar de errores en un bloque de bits, aunque no todos los patrones posibles.", "Los métodos basados en suma de comprobación (checksum) suman los datos en bloques y verifican el resultado en el receptor.", "CRC (Comprobación de Redundancia Cíclica) ofrece una detección mucho más robusta mediante división polinómica y es el método más usado en la práctica.", "Detectar un error no implica corregirlo: muchas veces la trama dañada simplemente se descarta."], "quiz": [{"q": "¿Qué técnica de detección de errores usa división polinómica y ofrece mayor robustez que la paridad simple?", "opts": ["Bit de paridad", "CRC (Comprobación de Redundancia Cíclica)", "NAT", "ARP"], "correct": 1}, {"q": "¿Qué limitación tiene un único bit de paridad para detectar errores?", "opts": ["No detecta ningún tipo de error", "No puede detectar un número par de errores en el bloque", "Solo funciona con UDP", "Requiere cifrado previo"], "correct": 1}, {"q": "¿Qué ocurre típicamente cuando la capa de enlace detecta que una trama llegó corrupta?", "opts": ["La corrige automáticamente siempre", "La trama dañada se descarta", "Se reenvía por otra interfaz sin verificar", "Se convierte en un paquete multicast"], "correct": 1}]}, {"id": "RED-26", "level": "Intermedio", "title": "Protocolos de acceso múltiple y ARP", "overview": "Cuando varios dispositivos comparten un mismo medio de transmisión, se necesitan protocolos que coordinen el acceso al canal.", "points": ["Protocolos de particionamiento del canal (TDMA, FDMA): dividen el canal en intervalos de tiempo o frecuencias asignadas.", "Protocolos de acceso aleatorio (como CSMA/CD en Ethernet clásica): los dispositivos transmiten cuando detectan el canal libre y gestionan colisiones.", "Protocolos de toma de turnos (token passing): un testigo circula entre los nodos otorgando el derecho a transmitir.", "ARP (Address Resolution Protocol) resuelve una dirección IP a su correspondiente dirección MAC dentro de la misma red local."], "quiz": [{"q": "¿Qué tipo de protocolo de acceso múltiple asigna intervalos de tiempo fijos a cada estación?", "opts": ["TDMA", "CSMA/CD", "Token passing", "ARP"], "correct": 0}, {"q": "¿Qué protocolo de acceso aleatorio detecta colisiones en el medio compartido, típico de Ethernet clásica?", "opts": ["TDMA", "CSMA/CD", "FDMA", "Token ring"], "correct": 1}, {"q": "¿Qué protocolo resuelve una dirección IP a su dirección MAC correspondiente en la red local?", "opts": ["DNS", "DHCP", "ARP", "ICMP"], "correct": 2}]}, {"id": "RED-27", "level": "Avanzado", "title": "Movilidad y redes celulares", "overview": "La gestión de la movilidad permite que un dispositivo mantenga su conectividad mientras cambia de punto de acceso a la red.", "points": ["IP móvil (Mobile IP) permite que un host conserve su dirección IP de origen ('home address') mientras se desplaza, mediante un agente local y uno externo.", "Las redes celulares organizan la cobertura en celdas atendidas por estaciones base, evolucionando desde 3G hacia 4G/LTE con arquitecturas todo-IP.", "El traspaso (handoff) transfiere una llamada o sesión de datos de una estación base a otra sin interrupción perceptible.", "La gestión de la movilidad resuelve dos problemas centrales: cómo direccionar al nodo móvil y cómo enrutar los datos hacia su ubicación actual."], "quiz": [{"q": "¿Qué tecnología permite que un host conserve su dirección IP de origen mientras se desplaza entre redes?", "opts": ["NAT", "IP móvil (Mobile IP)", "DHCP", "ARP"], "correct": 1}, {"q": "¿Cómo se denomina el proceso de transferir una llamada o sesión activa de una estación base a otra sin interrupción perceptible?", "opts": ["Traspaso (handoff)", "Fragmentación", "Multiplexación", "Encapsulación"], "correct": 0}, {"q": "¿Qué generación de redes celulares introdujo una arquitectura orientada completamente a IP, conocida como LTE?", "opts": ["2G", "3G", "4G", "1G"], "correct": 2}]}, {"id": "RED-28", "level": "Básico", "title": "Línea de comandos de Windows (CMD)", "overview": "Estas herramientas de consola permiten probar la conectividad y revisar la configuración de red de un host sin necesidad de una interfaz gráfica.", "points": ["ping prueba la conectividad hacia otro host: verifica si la pila TCP/IP funciona y si el destino responde.", "ipconfig muestra la dirección IP, la máscara de subred y el gateway predeterminado; con el modificador /all añade también la dirección MAC y el servidor DHCP.", "netstat muestra las conexiones de red activas del host, mientras que nslookup consulta directamente al servidor DNS por información de un dominio.", "tracert muestra la ruta (los saltos) que toma el tráfico hacia el destino, útil para ubicar en qué punto falla la conectividad.", "ipconfig /release libera la dirección IP asignada por DHCP; ipconfig /renew solicita una nueva dirección al servidor DHCP."], "quiz": [{"q": "¿Qué intenta determinar principalmente un usuario al ejecutar el comando ping hacia una dirección IP?", "opts": ["Si la pila TCP/IP funciona sin enviar tráfico por el cable", "Si hay conectividad con el dispositivo de destino", "La ruta exacta que tomará el tráfico", "Qué tipo de dispositivo está en el destino"], "correct": 1}, {"q": "Un técnico pide hacer ping al gateway predeterminado configurado en la estación de trabajo. ¿Cuál es el propósito de esta prueba?", "opts": ["Obtener una IP dinámica del servidor", "Solicitar que el gateway reenvíe la conexión al servidor de archivos", "Probar que el host pueda establecer conexión con otros hosts de su red y de otras redes", "Resolver el nombre de dominio del servidor a su IP"], "correct": 2}, {"q": "¿Qué comando expone la dirección IP, la máscara de subred y el gateway predeterminado de un host, sin mostrar la dirección MAC?", "opts": ["ipconfig", "ipconfig /all", "netstat", "nslookup"], "correct": 0}, {"q": "¿Qué utilidad de línea de comandos permite ver la dirección MAC de un host?", "opts": ["nslookup", "ipconfig /all", "ping", "tracert"], "correct": 1}, {"q": "Un usuario puede hacer ping a un sitio por su IP pero no puede navegarlo usando el nombre de dominio en el navegador. ¿Cuál es la causa más probable?", "opts": ["La IP de la PC de origen es incorrecta", "La IP del gateway es incorrecta", "El servidor DHCP no está bien configurado", "El servidor DNS no funciona"], "correct": 3}, {"q": "Un técnico determina que la PC no recibió una IP correcta del servidor DHCP. ¿Qué comando debe usar para solicitar una nueva IP?", "opts": ["ping", "ipconfig /release", "tracert", "ipconfig /renew"], "correct": 3}, {"q": "¿Qué utilidad de línea de comandos muestra todas las conexiones de red activas en una PC?", "opts": ["nslookup", "netstat", "ipconfig", "ipconfig /all"], "correct": 1}]}]}, {"id": "SEG", "name": "Seguridad Informática", "icon": "ShieldCheck", "color": "#E1584B", "topics": [{"id": "SEG-01", "title": "Criptografía aplicada", "overview": "Base matemática para garantizar confidencialidad, integridad y autenticidad.", "points": ["Simétrica (AES) vs asimétrica (RSA, ECC): trade-off velocidad vs distribución de claves.", "Funciones hash (SHA-256, bcrypt/argon2 para contraseñas) y resistencia a colisiones.", "Infraestructura de clave pública (PKI): certificados X.509, cadenas de confianza, CA/RA.", "TLS: handshake, cifrado de sesión y perfect forward secrecy."], "quiz": [{"q": "¿Qué tipo de cifrado usa la misma clave para cifrar y descifrar?", "opts": ["Asimétrico", "Simétrico", "Hash", "Firma digital"], "correct": 1}, {"q": "¿Qué propiedad busca una función hash resistente a colisiones?", "opts": ["Que dos entradas distintas no generen la misma salida", "Que sea reversible", "Que use clave pública", "Que cifre en bloques"], "correct": 0}, {"q": "¿Qué componente de una PKI emite y firma los certificados digitales?", "opts": ["RA", "CA (Autoridad Certificadora)", "CRL", "OCSP"], "correct": 1}], "level": "Intermedio"}, {"id": "SEG-02", "title": "Gestión de identidad y acceso (IAM)", "overview": "Control de quién accede a qué recurso y bajo qué condiciones.", "points": ["Principio de mínimo privilegio y separación de funciones.", "MFA: factores de conocimiento, posesión e inherencia; ataques de SIM swapping.", "SSO federado: SAML, OAuth 2.0 y OpenID Connect.", "Modelo Zero Trust: 'nunca confiar, siempre verificar', microsegmentación."], "quiz": [{"q": "¿Qué principio establece dar a cada usuario solo los permisos estrictamente necesarios?", "opts": ["Defensa en profundidad", "Mínimo privilegio", "Zero trust", "Separación de funciones"], "correct": 1}, {"q": "¿Qué protocolo se usa comúnmente para SSO federado basado en tokens?", "opts": ["SAML", "SNMP", "SMTP", "FTP"], "correct": 0}, {"q": "¿Qué modelo asume que ninguna conexión, interna o externa, es confiable por defecto?", "opts": ["Perímetro clásico", "Zero Trust", "DMZ tradicional", "VPN de sitio a sitio"], "correct": 1}], "level": "Intermedio"}, {"id": "SEG-03", "title": "Seguridad perimetral", "overview": "Controles que filtran y monitorizan el tráfico entre zonas de confianza distinta.", "points": ["Firewalls: filtrado de paquetes, stateful inspection, next-gen (NGFW) con inspección de aplicación.", "IDS vs IPS: detección basada en firmas vs anomalías.", "Zonas DMZ y segmentación de red para limitar movimiento lateral.", "Proxies y filtrado web/DNS como capa adicional de defensa."], "quiz": [{"q": "¿Qué dispositivo filtra tráfico basándose en el estado de la conexión (stateful)?", "opts": ["Hub", "Firewall", "Switch", "Access Point"], "correct": 1}, {"q": "¿Cuál es la diferencia principal entre IDS e IPS?", "opts": ["El IDS detecta y el IPS detecta y bloquea", "Son lo mismo", "El IPS solo funciona en capa 2", "El IDS cifra el tráfico"], "correct": 0}, {"q": "¿Qué zona de red aloja servicios expuestos a Internet sin comprometer la red interna?", "opts": ["VLAN nativa", "DMZ", "Backbone", "Subred de gestión"], "correct": 1}, {"q": "¿Qué elemento de hardware o software controla las comunicaciones entre una red local e Internet, permitiendo o denegando transmisiones según políticas de seguridad?", "opts" ", "Identificación", "Preparación"], "correct": 1}], "level": "Avanzado"}, {"id": "SEG-06", "title": "Hardening de sistemas", "overview": "Reducción de la superficie de ataque de un sistema mediante configuración segura.", "points": ["Deshabilitar servicios y puertos innecesarios; principio de superficie mínima.", "Gestión de parches y ciclo de vida de vulnerabilidades (CVE, CVSS).", "Baselines de configuración (CIS Benchmarks) y auditoría continua.", "Segregación de cuentas administrativas y uso de bóvedas de credenciales (PAM)."], "quiz": [{"q": "¿Qué recurso define configuraciones seguras de referencia para distintos sistemas?", "opts": ["CVE", "CIS Benchmarks", "CVSS", "SLA"], "correct": 1}, {"q": "¿Qué sistema gestiona y protege credenciales privilegiadas?", "opts": ["PAM", "DNS", "DHCP", "VPN"], "correct": 0}, {"q": "¿Qué sistema identifica y clasifica la severidad de una vulnerabilidad conocida?", "opts": ["CVE y CVSS", "SLA", "RTO", "DHCP"], "correct": 0}], "level": "Intermedio"}, {"id": "SEG-07", "title": "Normativas y cumplimiento", "overview": "Marcos legales y estándares que rigen la gestión de la seguridad de la información.", "points": ["ISO/IEC 27001: SGSI, controles del Anexo A, ciclo PDCA.", "NIST Cybersecurity Framework: identificar, proteger, detectar, responder, recuperar.", "Regulaciones de protección de datos (tipo RGPD) y su impacto técnico.", "Auditorías internas/externas y gestión de evidencias de cumplimiento."], "quiz": [{"q": "¿Qué norma internacional define un Sistema de Gestión de Seguridad de la Información (SGSI)?", "opts": ["ISO 27001", "ISO 9001", "PCI DSS", "NIST 800-53"], "correct": 0}, {"q": "¿Cuáles son las cinco funciones principales del NIST Cybersecurity Framework?", "opts": ["Identificar, proteger, detectar, responder, recuperar", "Planificar, hacer, verificar, actuar", "Analizar, diseñar, construir, probar, desplegar", "Confidencialidad, integridad, disponibilidad, autenticidad, no repudio"], "correct": 0}, {"q": "¿Qué ciclo de mejora continua se asocia con un SGSI basado en ISO 27001?", "opts": ["DORA", "PDCA (Plan-Do-Check-Act)", "DevOps", "SDLC"], "correct": 1}], "level": "Intermedio"}, {"id": "SEG-08", "title": "Ethical hacking y pentesting", "overview": "Evaluación autorizada de la seguridad simulando técnicas de un atacante real.", "points": ["Metodologías: PTES, OSSTMM y fases (reconocimiento, escaneo, explotación, post-explotación).", "Reconocimiento pasivo vs activo; enumeración de servicios y versiones.", "Explotación controlada y elevación de privilegios en entornos de laboratorio.", "Informe de hallazgos: severidad, evidencia y recomendaciones de remediación."], "quiz": [{"q": "¿Cuál es la primera fase típica de un pentest?", "opts": ["Explotación", "Reconocimiento", "Post-explotación", "Reporte"], "correct": 1}, {"q": "¿Qué documento resume los hallazgos, severidad y recomendaciones de un pentest?", "opts": ["SLA", "Informe de hallazgos", "Runbook", "Baseline"], "correct": 1}, {"q": "¿Cómo se llama la prueba de seguridad realizada sin conocimiento previo del sistema por parte del evaluador?", "opts": ["Caja blanca", "Caja negra", "Caja gris", "Auditoría documental"], "correct": 1}], "level": "Avanzado"}, {"id": "SEG-09", "title": "Malware y análisis de amenazas", "overview": "Estudio del software malicioso, sus tipos y las técnicas de detección y contención.", "points": ["Tipos principales: virus, gusanos, troyanos, ransomware, spyware, rootkits.", "Técnicas de evasión: ofuscación, polimorfismo, living-off-the-land.", "Análisis estático vs dinámico (sandboxing) de muestras sospechosas.", "Indicadores de compromiso y firmas de detección (por ejemplo, reglas YARA)."], "quiz": [{"q": "¿Qué tipo de malware cifra los archivos de la víctima y exige un rescate?", "opts": ["Spyware", "Ransomware", "Rootkit", "Adware"], "correct": 1}, {"q": "¿Qué técnica ejecuta una muestra sospechosa en un entorno aislado para observar su comportamiento?", "opts": ["Análisis estático", "Sandboxin lizable", "Sin consistencia"], "correct": 1}], "level": "Intermedio"}, {"id": "BD-04", "title": "Administración y tuning de rendimiento", "overview": "Ajuste de motores de base de datos para sostener carga con buen tiempo de respuesta.", "points": ["Identificación de cuellos de botella: CPU, I/O de disco, memoria de buffer pool.", "Particionamiento horizontal (sharding) y vertical de tablas grandes.", "Connection pooling y su impacto en concurrencia de aplicaciones.", "Mantenimiento: reindexado, actualización de estadísticas, vacuum/analyze."], "quiz": [{"q": "¿Qué técnica divide una tabla grande en partes distribuidas entre servidores?", "opts": ["Replicación", "Sharding", "Indexado", "Normalización"], "correct": 1}, {"q": "¿Qué práctica reduce la sobrecarga de abrir/cerrar conexiones frecuentemente?", "opts": ["Connection pooling", "Query caching", "Sharding", "Replicación"], "correct": 0}, {"q": "¿Qué operación actualiza las estadísticas que usa el optimizador para elegir planes de consulta eficientes?", "opts": ["VACUUM / ANALYZE", "DROP", "TRUNCATE", "GRANT"], "correct": 0}], "level": "Avanzado"}, {"id": "BD-05", "title": "Replicación y alta disponibilidad", "overview": "Mecanismos que garantizan continuidad del servicio ante fallos de nodo.", "points": ["Replicación síncrona vs asíncrona; consistencia frente a disponibilidad (teorema CAP).", "Topologías maestro-esclavo, maestro-maestro y clústeres multi-nodo.", "Failover automático y detección de nodo caído (heartbeat, quorum).", "Balanceo de lectura entre réplicas para escalar consultas."], "quiz": [{"q": "Según el teorema CAP, ¿qué dos propiedades no pueden garantizarse simultáneamente ante particiones de red?", "opts": ["Consistencia y disponibilidad", "Atomicidad y durabilidad", "Seguridad y rendimiento", "Escalabilidad y normalización"], "correct": 0}, {"q": "¿Qué mecanismo detecta si un nodo maestro ha caído para iniciar el failover?", "opts": ["Heartbeat", "Sharding", "Vacuum", "Journaling"], "correct": const STATE_KEY = "kb-duo:state";
let state = { completed: {}, xp: 0, streak: 0, lastActive: null };

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch(e) {}
  updateStreak();
  renderPath();
}
function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e) { console.error(e); }
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function updateStreak() {
  const today = todayStr();
  if (state.lastActive === today) { /* ya contabilizado hoy */ }
  else {
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    if (state.lastActive === yesterday) state.streak += 1;
    else state.streak = 1;
    state.lastActive = today;
    saveState();
  }
}
function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  for (const c of CATEGORIES) {
    const t = c.topics.find(t => t.id === topicId);
    if (t) return { color: c.color_override || UNIT_COLORS[c.id], catId: c.id };
  }
  return { color: "#1CB0F6", catId: "" };
}

const LEVEL_ORDER = { "Básico": 0, "Intermedio": 1, "Avanzado": 2 };

function orderedTopics(cat) {
  const hasLevels = cat.topics.some(t => t.level);
  if (!hasLevels) return cat.topics.map((t, i) => ({...t, _idx: i}));
  return cat.topics.map((t, i) => ({...t, _idx: i}))
    .slice()
    .sort((a, b) => (LEVEL_ORDER[a.level] ?? 9) - (LEVEL_ORDER[b.level] ?? 9) || a._idx - b._idx);
}

function renderPath() {
  document.getElementById("streakVal").textContent = state.streak;
  document.getElementById("xpVal").textContent = state.xp;
  const wrap = document.getElementById("pathScroll");
  let html = "";
  CATEGORIES.forEach(cat => {
    const color = UNIT_COLORS[cat.id];
    const icon = UNIT_ICONS[cat.id] || "📚";
    const doneCount = cat.topics.filter(t => state.completed[t.id]).length;
    const topics = orderedTopics(cat);
    // primer tema no completado = "actual"
    let currentSet = false;
    html += `<div class="unit-banner" style="background:${color}">
      <div class="u-left"><span class="u-icon">${icon}</span><span class="u-name">${escapeHtml(cat.name)}</span></div>
      <div class="u-count">${doneCount}/${cat.topics.length}</div>
    </div>`;
    html += `<div class="path-track">`;
    let lastLevel = null;
    topics.forEach((t, idx) => {
      if (t.level && t.level !== lastLevel) {
        html += `<div class="level-divider">${t.level.toUpperCase()}</div>`;
        lastLevel = t.level;
      }
      const done = !!state.completed[t.id];
      let isCurrent = false;
      if (!done && !currentSet) { isCurrent = true; currentSet = true; }
      const offset = (idx % 3 === 0) ? "0px" : (idx % 3 === 1 ? "56px" : "-56px");
      const nodeClass = done ? "done" : (isCurrent ? "current" : "locked-look");
      const style = done || isCurrent ? `background:${color}` : "";
      const content = done ? "✓" : (idx+1);
      html += `<div class="node-row" style="transform:translateX(${offset})">
        <div>
          <button class="lesson-node ${nodeClass}" style="${style}" data-topic="${t.id}">${content}</button>
          <div class="node-label">${escapeHtml(t.title)}</div>
          ${t.level ? `<div style="text-align:center"><span class="level-badge ${t.level}">${t.level}</span></div>` : ""}
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll(".lesson-node").forEach(btn => {
    btn.addEventListener("click", () => openLesson(btn.getAttribute("data-topic")));
  });
}

/* ---------------- LECCIÓN ---------------- */

let lesson = null; // {topic, color, steps:[...], stepIndex, correctCount}

function buildSteps(topic) {
  const steps = [
    { type: "concept" },
    { type: "meaning" },
    { type: "keypoints" },
  ];
  (topic.quiz || []).forEach(q => steps.push({ type: "question", data: q }));
  steps.push({ type: "summary" });
  return steps;
}

function openLesson(topicId) {
  let topic = null, color = "#1CB0F6";
  for (const c of CATEGORIES) {
    const t = c.topics.find(t => t.id === topicId);
    if (t) { topic = t; color = UNIT_COLORS[c.id]; break; }
  }
  if (!topic) return;
  lesson = { topic, color, steps: buildSteps(topic), stepIndex: 0, correctCount: 0, answered: false };
  document.getElementById("lessonOverlay").classList.remove("hidden");
  renderLessonStep();
}

function closeLesson() {
  document.getElementById("lessonOverlay").classList.add("hidden");
  lesson = null;
  renderPath();
}

function renderLessonStep() {
  const step = lesson.steps[lesson.stepIndex];
  const total = lesson.steps.length;
  const pct = Math.round((lesson.stepIndex / (total-1)) * 100);
  document.getElementById("lessonProgressFill").style.width = pct + "%";
  document.getElementById("lessonProgressFill").style.background = lesson.color;

  const body = document.getElementById("lessonBody");
  const bar = document.getElementById("bottomBar");
  bar.className = "bottom-bar";

  if (step.type === "concept") {
    const levelTag = lesson.topic.level ? ` <span class="level-badge ${lesson.topic.level}">${lesson.topic.level}</span>` : "";
    body.innerHTML = `<div class="teach-card">
      <div class="teach-eyebrow" style="color:${lesson.color}">CONCEPTO${levelTag}</div>
      <div class="teach-icon">💡</div>
      <div class="teach-title">${escapeHtml(lesson.topic.title)}</div>
    </div>`;
    setPrimaryAction("Continuar", () => nextStep());
  } else if (step.type === "meaning") {
    body.innerHTML = `<div class="teach-card">
      <div class="teach-eyebrow" style="color:${lesson.color}">SIGNIFICADO</div>
      <div class="teach-icon">📖</div>
      <div class="teach-text">${escapeHtml(lesson.topic.overview)}</div>
    </div>`;
    setPrimaryAction("Continuar", () => nextStep());
  } else if (step.type === "keypoints") {
    body.innerHTML = `<div class="teach-card">
      <div class="teach-eyebrow" style="color:${lesson.color}">PUNTOS CLAVE</div>
      <div class="teach-icon">🎯</div>
      <ul class="teach-points">
        ${lesson.topic.points.map(p => `<li><span class="bullet-emoji">✅</span><span>${escapeHtml(p)}</span></li>`).join("")}
      </ul>
    </div>`;
    setPrimaryAction("Empezar evaluación", () => nextStep());
  } else if (step.type === "question") {
    renderQuestion(step.data);
  } else if (step.type === "summary") {
    renderSummary();
  }
}

function setPrimaryAction(label, onClick) {
  const bar = document.getElementById("bottomBar");
  bar.innerHTML = `<button class="btn btn-green" id="mainActionBtn">${label}</button>`;
  document.getElementById("mainActionBtn").addEventListener("click", onClick);
}

function renderQuestion(q) {
  const body = document.getElementById("lessonBody");
  body.innerHTML = `<div class="quiz-card">
    <div class="teach-eyebrow" style="color:${lesson.color}">EVALUACIÓN</div>
    <div class="quiz-title">${escapeHtml(q.q)}</div>
    <div id="quizOpts">
      ${q.opts.map((o,oi) => `<button class="quiz-opt" data-oi="${oi}">${escapeHtml(o)}</button>`).join("")}
    </div>
  </div>`;
  const bar = document.getElementById("bottomBar");
  bar.innerHTML = `<button class="btn btn-outline" id="mainActionBtn" style="opacity:.5;pointer-events:none">Continuar</button>`;

  document.getElementById("quizOpts").querySelectorAll(".quiz-opt").forEach(btn => {
    btn.addEventListener("click", () => {
      const oi = parseInt(btn.getAttribute("data-oi"), 10);
      const ok = oi === q.correct;
      if (ok) lesson.correctCount++;
      document.getElementById("quizOpts").querySelectorAll(".quiz-opt").forEach((b2, i2) => {
        b2.classList.add("disabled");
        if (i2 === q.correct) b2.classList.add("correct");
        else if (i2 === oi) b2.classList.add("wrong");
        else b2.classList.add("dim");
      });
      showFeedback(ok, q.opts[q.correct]);
    });
  });
}

function showFeedback(ok, correctText) {
  const bar = document.getElementById("bottomBar");
  bar.className = "bottom-bar " + (ok ? "feedback-correct" : "feedback-wrong");
  bar.innerHTML = `
    <div class="feedback-row ${ok ? "ok" : "bad"}">
      <span style="font-size:22px">${ok ? "✅" : "❌"}</span>
      <div>
        <div>${ok ? "¡Correcto! +10 XP" : "Incorrecto"}</div>
        ${ok ? "" : `<div class="feedback-sub">Respuesta correcta: ${escapeHtml(correctText)}</div>`}
      </div>
    </div>
    <button class="btn ${ok ? "btn-green" : "btn-green"}" id="mainActionBtn">Continuar</button>
  `;
  if (ok) { state.xp += 10; document.getElementById("xpVal").textContent = state.xp; saveState(); }
  document.getElementById("mainActionBtn").addEventListener("click", () => nextStep());
}

function renderSummary() {
  const body = document.getElementById("lessonBody");
  const totalQ = (lesson.topic.quiz || []).length;
  const bonus = 5;
  body.innerHTML = `<div class="summary-wrap">
    <div class="summary-emoji">🎉</div>
    <div class="summary-title">¡Lección completada!</div>
    <div class="summary-stats">
      <div class="summary-chip xp"><div class="n">+${bonus + lesson.correctCount*10}</div><div class="l">XP total</div></div>
      <div class="summary-chip acc"><div class="n">${lesson.correctCount}/${totalQ}</div><div class="l">Correctas</div></div>
    </div>
  </div>`;
  const bar = document.getElementById("bottomBar");
  bar.className = "bottom-bar";
  bar.innerHTML = `<button class="btn btn-green" id="mainActionBtn">Continuar</button>`;
  if (!state.completed[lesson.topic.id]) {
    state.completed[lesson.topic.id] = true;
    state.xp += bonus;
    saveState();
  }
  document.getElementById("mainActionBtn").addEventListener("click", () => closeLesson());
}

function nextStep() {
  if (lesson.stepIndex + 1 >= lesson.steps.length) { closeLesson(); return; }
  lesson.stepIndex++;
  renderLessonStep();
}

document.getElementById("closeLesson").addEventListener("click", closeLesson);

loadState();
</script>
</body>
</html>
