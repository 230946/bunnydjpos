<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo.png" type="image/png">
<title>DJPOS — Restablecer contraseña</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg3:#e5f7ee;
  --text:#102A24;--text2:#2a5040;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --green:#0B8457;--green-d:#086644;
  --red-d:#A32D2D;--red-l:#FCEBEB;--green-l:#E1F5EE;
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e1e1c;--bg3:#323230;
  --text:#f0efe8;--text2:#a0a09a;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
  --red-l:#3a1010;--red-d:#f09595;--green-l:#04342c;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg3);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:32px 28px;width:360px;max-width:100%}
.logo{display:block;width:72px;height:72px;margin:0 auto 12px;border-radius:50%;object-fit:cover}
h1{font-size:19px;text-align:center;margin-bottom:6px}
.sub{color:var(--text2);text-align:center;font-size:13px;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
.field input:focus{outline:2px solid var(--green);outline-offset:-1px}
.btn{display:block;width:100%;padding:11px;border:none;border-radius:var(--r);background:var(--green);color:#fff;font-size:14px;font-weight:700;font-family:inherit;text-align:center;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--green-d)}
.btn:disabled{opacity:.6;cursor:wait}
.check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);margin-bottom:16px;cursor:pointer}
.msg{padding:10px 12px;border-radius:var(--r);font-size:13px;margin-bottom:14px}
.msg.err{background:var(--red-l);color:var(--red-d)}
.msg.ok{background:var(--green-l);color:var(--green-d)}
@media(prefers-color-scheme:dark){.msg.ok{color:#5dcaa5}}
.hide{display:none}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/img/logo.png" alt="DJPOS">
  <h1 id="titulo">Restablecer contraseña</h1>
  <p class="sub" id="sub">Verificando el enlace…</p>
  <div id="msg" class="msg hide" role="alert"></div>

  <form id="form" class="hide" onsubmit="guardar(event)">
    <div class="field">
      <label for="p1">Nueva contraseña (mínimo 8 caracteres)</label>
      <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="p2">Repite la contraseña</label>
      <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <label class="check"><input id="ver" type="checkbox" onchange="verClaves(this.checked)"> Mostrar contraseña</label>
    <button id="btn-guardar" class="btn" type="submit">Guardar contraseña</button>
  </form>

  <a id="ir-login" class="btn hide" href="/login">Ir a iniciar sesión</a>
</main>

<script>
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
// El token no se queda en la barra de direcciones ni en el historial.
history.replaceState(null, '', location.pathname);

function mostrarMsg(texto, tipo){
  $('msg').textContent = texto;
  $('msg').className = 'msg ' + tipo;
}
function terminar(titulo, sub){
  $('titulo').textContent = titulo;
  $('sub').textContent = sub;
  $('msg').className = 'msg hide';
  $('form').classList.add('hide');
  $('ir-login').classList.remove('hide');
}
const ENLACE_MALO = 'Este enlace ya se usó o venció. Vuelve al inicio de sesión y solicita uno nuevo con "¿Olvidaste tu contraseña?".';
function verClaves(ver){ $('p1').type = $('p2').type = ver ? 'text' : 'password'; }

async function post(ruta, cuerpo){
  const r = await fetch('/api/auth/' + ruta, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo)
  });
  const d = await r.json().catch(() => ({}));
  return { ok: r.ok, d };
}

async function iniciar(){
  if (!token) return terminar('Enlace no válido', ENLACE_MALO);
  try {
    const { ok, d } = await post('reset-password/validar', { token });
    if (!ok) throw new Error(d.error || 'No se pudo verificar el enlace.');
    if (!d.valido) return terminar('Enlace no válido', ENLACE_MALO);
    $('sub').textContent = 'Elige tu nueva contraseña.';
    $('form').classList.remove('hide');
    $('p1').focus();
  } catch (e) {
    $('sub').textContent = '';
    mostrarMsg(e.message === 'Failed to fetch' ? 'No hay conexión. Revisa tu internet y recarga la página.' : e.message, 'err');
  }
}

async function guardar(ev){
  ev.preventDefault();
  const password = $('p1').value;
  if (password.length < 8) return mostrarMsg('La contraseña debe tener al menos 8 caracteres.', 'err');
  if (password !== $('p2').value) return mostrarMsg('Las contraseñas no coinciden.', 'err');
  $('btn-guardar').disabled = true;
  try {
    const { ok, d } = await post('reset-password', { token, password });
    if (!ok) { mostrarMsg(d.error || 'No se pudo guardar la contraseña.', 'err'); return; }
    terminar('Contraseña actualizada', 'Ya puedes entrar con tu nueva contraseña.');
  } catch (e) {
    mostrarMsg('No hay conexión. Revisa tu internet e intenta de nuevo.', 'err');
  } finally {
    $('btn-guardar').disabled = false;
  }
}
iniciar();
</script>
</body>
</html>
